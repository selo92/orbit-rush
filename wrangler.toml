# Production host: static Vite build + /api on one workers.dev origin.
# database_id is not a secret. `npm run deploy` rewrites it when the
# logged-in Cloudflare account has a different `orbit-rush-scores` database.
name = "orbit-rush"
main = "worker/index.js"
compatibility_date = "2026-09-25"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "orbit-rush-scores"
database_id = "ecd023bc-1557-4c28-b287-5f50f65ec8d9"
migrations_dir = "migrations"
